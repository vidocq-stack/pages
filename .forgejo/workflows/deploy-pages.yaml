name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "manual"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Quarkus app (batch generator baked in)
        run: ./mvnw package -ntp -DskipTests -Dquarkus.roq.generator.batch=true

      - name: Generate static site
        # quarkus.roq.generator.batch is a build-time property fixed above; just run the jar.
        run: java -jar target/quarkus-app/quarkus-run.jar

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TRIGGER="${{ github.event_name }}"
          NOTE="${{ github.event.inputs.reason }}"
          MSG="ci: deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) [${TRIGGER}${NOTE:+ — $NOTE}]"
          npx wrangler@latest pages deploy target/roq/ \
            --project-name=vidocq-site \
            --branch=main \
            --commit-message="$MSG"
