name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "manual"

jobs:
  deploy:
    runs-on: vidocq-runner
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Quarkus app (batch generator baked in)
        run: ./mvnw package -ntp -DskipTests -Dquarkus.roq.generator.batch=true

      - name: Generate static site
        # quarkus.roq.generator.batch is a build-time property fixed above; just run the jar.
        run: java -jar target/quarkus-app/quarkus-run.jar

      - name: Create Cloudflare Pages project (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@latest pages project create vidocq-site --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TRIGGER="${{ github.event_name }}"
          NOTE="${{ github.event.inputs.reason }}"
          MSG="ci: deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) [${TRIGGER}${NOTE:+ — $NOTE}]"
          npx wrangler@latest pages deploy target/roq/ \
            --project-name=vidocq-site \
            --branch=main \
            --commit-message="$MSG"

      - name: Notify Slack on success
        if: success()
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}
          commit-author: ${{ github.event.head_commit.author.name }}

      - name: Notify Slack on failure
        if: failure()
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
