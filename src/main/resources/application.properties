quarkus.roq.dir=.
site.url=https://vidocq.dev
site.default-locale=en
site.page-layout=page
editor.page-markup=asciidoc
editor.doc-markup=asciidoc
editor.visual-editor.enabled=false

# Dev mode: generate links against localhost so in-page URLs resolve correctly
%dev.site.url=http://localhost:8080

# Static site generation — activated at runtime with: java -Dquarkus.roq.generator.batch=true -jar quarkus-run.jar
# Output directory is relative to target/: generated files land in target/roq/
quarkus.roq.generator.batch=false
quarkus.roq.generator.output-dir=roq
quarkus.roq.generator.timeout=120

# ── PlantUML / asciidoctor-diagram ──────────────────────────────
# plantumlconfig is the attribute asciidoctor-diagram actually reads (not plantuml-include)
# Resolved relative to base_dir (= the parent directory of the .adoc file being processed)
# For content/*.adoc → base_dir = content/ → finds content/plantuml-skin.iuml
quarkus.asciidoc.attributes.plantumlconfig=plantuml-skin.iuml
# SVG + inline: diagrams are embedded directly in the HTML, no external image files
quarkus.asciidoc.attributes.plantuml-format=svg
quarkus.asciidoc.attributes.plantuml-opts=inline
