quarkus.roq.dir=.
site.url=https://vidocq.dev
site.default-locale=en
site.page-layout=page
editor.page-markup=asciidoc
editor.doc-markup=asciidoc
editor.visual-editor.enabled=false

# Dev mode: generate links against localhost so in-page URLs resolve correctly
%dev.site.url=http://localhost:8080

# Static site generation.
# quarkus.roq.generator.batch is a BUILD-TIME property since Roq 2.1.x: it must be
# baked in at build time (./mvnw package -Dquarkus.roq.generator.batch=true),
# setting it with -D at runtime has no effect.
# Output directory is relative to target/: generated files land in target/roq/
quarkus.roq.generator.batch=false
quarkus.roq.generator.output-dir=roq
quarkus.roq.generator.timeout=120

# ── Syntax highlighting ─────────────────────────────────────────
# Done client-side with a self-hosted highlight.js (public/js/) wired in the
# main layout. Rouge (server-side) crashes the bundled JRuby asciidoctor with
# "undefined method beginning_of_line for nil" — do not re-enable it.

# ── PlantUML / asciidoctor-diagram ──────────────────────────────
# The single canonical PlantUML skin lives at content/plantuml-skin.iuml and is
# pulled into each diagram with a plain AsciiDoc include (e.g.
# include::../plantuml-skin.iuml[] right after @startuml/@startgantt). Roq's
# include processor resolves cross-directory includes against the site root, so
# no duplicate skin files or jail escapes are needed (unlike the config="..."
# attribute, which asciidoctor-diagram jails to each file's base_dir).
# SVG + inline: diagrams are embedded directly in the HTML, no external image files.
# Note: asciidoctor-diagram still writes its working files (diag-*.svg + .cache)
# next to the sources; they are pure by-products and are ignored via .gitignore
# (imagesoutdir/diagram-cachedir are not honored by the bundled version in SAFE mode).
quarkus.asciidoc.attributes.plantuml-format=svg
quarkus.asciidoc.attributes.plantuml-opts=inline

# ── Author pages generated from data/authors.yml (one page per author) ──
site.collections.authors.layout=author
site.collections.authors.from-data.id-key=_key
