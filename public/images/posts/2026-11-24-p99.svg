<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
<title id="t">p99 latency of a Vidocq REST application at each rate asked, every rate served</title>
<desc id="d">Median of 3 passes on the 0.4.0 line of 2026-11-18: 1.94 ms at 5,000 requests per second, 1.87 ms at 10,000, 2.17 ms at 20,000, 2.12 ms at 40,000, 2.53 ms at 60,000 and 5.02 ms at 80,000.</desc>

<style>
  .bg { fill: #f8faff; }
  .mark { fill: #1d4ed8; }
  .grid { stroke: #e2e8f0; }
  .t1 { fill: #0f172a; }
  .t2 { fill: #475569; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #111827; }
    .mark { fill: #4f8ff7; }
    .grid { stroke: #1f2937; }
    .t1 { fill: #f3f4f6; }
    .t2 { fill: #9ca3af; }
  }
</style>

<rect class="bg" x="0" y="0" width="600" height="340" rx="10"/>
<text class="t2" x="300" y="24" font-size="15" text-anchor="middle">p99 latency at each rate asked; every rate served in full</text>

<line class="grid" x1="66" x2="580" y1="274" y2="274" stroke-width="1"/>
<text class="t2" x="56" y="279" font-size="15" text-anchor="end">0 ms</text>
<line class="grid" x1="66" x2="580" y1="196" y2="196" stroke-width="1"/>
<text class="t2" x="56" y="201" font-size="15" text-anchor="end">2</text>
<line class="grid" x1="66" x2="580" y1="118" y2="118" stroke-width="1"/>
<text class="t2" x="56" y="123" font-size="15" text-anchor="end">4</text>
<line class="grid" x1="66" x2="580" y1="40" y2="40" stroke-width="1"/>
<text class="t2" x="56" y="45" font-size="15" text-anchor="end">6</text>

<rect class="mark" x="80.8" y="198.3" width="56" height="75.7" rx="4"/>
<text class="t1" x="108.8" y="190.3" font-size="16" font-weight="600" text-anchor="middle">1.94</text>
<text class="t2" x="108.8" y="298" font-size="15" text-anchor="middle">5k</text>

<rect class="mark" x="166.5" y="201.1" width="56" height="72.9" rx="4"/>
<text class="t1" x="194.5" y="193.1" font-size="16" font-weight="600" text-anchor="middle">1.87</text>
<text class="t2" x="194.5" y="298" font-size="15" text-anchor="middle">10k</text>

<rect class="mark" x="252.2" y="189.4" width="56" height="84.6" rx="4"/>
<text class="t1" x="280.2" y="181.4" font-size="16" font-weight="600" text-anchor="middle">2.17</text>
<text class="t2" x="280.2" y="298" font-size="15" text-anchor="middle">20k</text>

<rect class="mark" x="337.9" y="191.3" width="56" height="82.7" rx="4"/>
<text class="t1" x="365.9" y="183.3" font-size="16" font-weight="600" text-anchor="middle">2.12</text>
<text class="t2" x="365.9" y="298" font-size="15" text-anchor="middle">40k</text>

<rect class="mark" x="423.6" y="175.3" width="56" height="98.7" rx="4"/>
<text class="t1" x="451.6" y="167.3" font-size="16" font-weight="600" text-anchor="middle">2.53</text>
<text class="t2" x="451.6" y="298" font-size="15" text-anchor="middle">60k</text>

<rect class="mark" x="509.3" y="78.2" width="56" height="195.8" rx="4"/>
<text class="t1" x="537.3" y="70.2" font-size="16" font-weight="600" text-anchor="middle">5.02</text>
<text class="t2" x="537.3" y="298" font-size="15" text-anchor="middle">80k req/s</text>

<text class="t2" x="300" y="326" font-size="13" text-anchor="middle">Median of 3 passes, 2026-11-18. vidocq-benchmarks BENCH-20261118-01, 2018 Mac mini (i7-8700B).</text>
</svg>
