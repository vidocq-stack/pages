<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="The Vidocq detective moves his repositories from the mountain to the ice floe">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b58"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#31518f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16255f"/>
      <stop offset="1" stop-color="#0d1533"/>
    </linearGradient>
    <linearGradient id="floe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#b8cde4"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- constellation motif (echo of the banner) -->
  <g stroke="#b8cde4" stroke-width="1" opacity="0.35">
    <line x1="80" y1="60" x2="170" y2="95"/><line x1="170" y1="95" x2="140" y2="160"/>
    <line x1="920" y1="50" x2="1010" y2="80"/><line x1="1010" y1="80" x2="1080" y2="45"/>
    <line x1="1010" y1="80" x2="990" y2="150"/>
  </g>
  <g fill="#f8faff">
    <circle cx="80" cy="60" r="3"/><circle cx="170" cy="95" r="4"/><circle cx="140" cy="160" r="3"/>
    <circle cx="320" cy="55" r="2"/><circle cx="520" cy="40" r="2"/><circle cx="700" cy="70" r="2.5"/>
    <circle cx="920" cy="50" r="3"/><circle cx="1010" cy="80" r="4"/><circle cx="1080" cy="45" r="3"/>
    <circle cx="990" cy="150" r="3"/><circle cx="420" cy="90" r="2"/><circle cx="600" cy="30" r="2"/>
  </g>

  <!-- moon -->
  <circle cx="1060" cy="90" r="34" fill="#f8faff" opacity="0.9"/>
  <circle cx="1048" cy="82" r="30" fill="url(#sky)" opacity="0.55"/>

  <!-- mountain (the old home), waving goodbye flag -->
  <g>
    <path d="M -20 320 L 150 110 L 235 215 L 285 160 L 400 320 Z" fill="#0d1533"/>
    <path d="M -20 320 L 90 190 L 160 250 L 220 205 L 330 320 Z" fill="#182456"/>
    <path d="M 150 110 L 176 143 L 160 141 L 143 158 L 128 138 Z" fill="#e2e8f0"/>
    <!-- small flag on the summit -->
    <line x1="150" y1="110" x2="150" y2="78" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M 150 78 L 186 86 L 150 96 Z" fill="#b8cde4"/>
  </g>

  <!-- sea -->
  <rect y="300" width="1200" height="120" fill="url(#sea)"/>
  <g stroke="#b8cde4" stroke-width="2" opacity="0.35" fill="none">
    <path d="M 430 340 q 18 -8 36 0 t 36 0"/>
    <path d="M 540 375 q 18 -8 36 0 t 36 0"/>
    <path d="M 470 400 q 18 -8 36 0 t 36 0"/>
  </g>

  <!-- plank from the shore to the floe -->
  <path d="M 330 318 L 700 330 L 700 340 L 330 328 Z" fill="#8b5e3c"/>
  <path d="M 330 318 L 700 330 L 700 333 L 330 321 Z" fill="#a9784f"/>

  <!-- the ice floe (the new home) -->
  <g>
    <path d="M 660 336 L 705 322 L 810 316 L 960 320 L 1105 328 L 1150 342 L 1105 362 L 930 372 L 760 368 L 685 355 Z" fill="url(#floe)"/>
    <path d="M 685 355 L 760 368 L 930 372 L 1105 362 L 1150 342 L 1145 352 L 1100 374 L 925 384 L 755 379 L 690 364 Z" fill="#8fb0d6"/>
    <!-- server crates already landed -->
    <g>
      <rect x="890" y="252" width="64" height="64" rx="4" fill="#111b58" stroke="#b8cde4" stroke-width="2"/>
      <circle cx="904" cy="268" r="4" fill="#7fd1ae"/>
      <rect x="916" y="264" width="28" height="7" rx="2" fill="#31518f"/>
      <rect x="898" y="282" width="46" height="7" rx="2" fill="#31518f"/>
      <rect x="898" y="296" width="46" height="7" rx="2" fill="#31518f"/>
      <rect x="972" y="276" width="46" height="40" rx="4" fill="#182456" stroke="#b8cde4" stroke-width="2"/>
      <circle cx="984" cy="288" r="3.4" fill="#7fd1ae"/>
      <rect x="980" y="298" width="30" height="6" rx="2" fill="#31518f"/>
    </g>
    <!-- lantern on the floe -->
    <line x1="1075" y1="330" x2="1075" y2="270" stroke="#0d1533" stroke-width="4"/>
    <circle cx="1075" cy="262" r="9" fill="#f5d06f"/>
    <circle cx="1075" cy="262" r="16" fill="#f5d06f" opacity="0.25"/>
  </g>

  <!-- the detective, top hat and cape, pulling his hand-truck across the plank -->
  <g fill="#0a0f2b">
    <!-- cape flowing back -->
    <path d="M 505 216 C 480 232 460 262 452 300 L 470 304 C 482 272 494 250 512 238 Z"/>
    <!-- body / long coat -->
    <path d="M 512 214 C 500 240 494 272 492 306 L 534 308 C 536 276 534 246 528 220 Z"/>
    <!-- legs walking -->
    <path d="M 498 300 L 486 326 L 497 328 L 510 304 Z"/>
    <path d="M 522 302 L 530 328 L 541 327 L 534 303 Z"/>
    <!-- head -->
    <circle cx="521" cy="200" r="11"/>
    <!-- top hat -->
    <rect x="508" y="172" width="26" height="22" rx="2"/>
    <rect x="501" y="192" width="40" height="5" rx="2.5"/>
    <!-- arm to the hand-truck -->
    <path d="M 528 232 L 566 260 L 561 267 L 524 241 Z"/>
  </g>

  <!-- hand-truck with moving boxes -->
  <g>
    <line x1="566" y1="258" x2="596" y2="322" stroke="#0a0f2b" stroke-width="5"/>
    <circle cx="600" cy="326" r="9" fill="#0a0f2b"/>
    <circle cx="600" cy="326" r="4" fill="#b8cde4"/>
    <g stroke="#5c3a21" stroke-width="1.5">
      <rect x="576" y="286" width="52" height="34" rx="3" fill="#a9784f"/>
      <rect x="582" y="252" width="46" height="30" rx="3" fill="#8b5e3c"/>
      <rect x="590" y="224" width="36" height="24" rx="3" fill="#a9784f"/>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#f8faff" font-size="12" text-anchor="middle">
      <text x="602" y="307">vauban</text>
      <text x="605" y="271">cassini</text>
      <text x="608" y="240">chappe</text>
    </g>
    <text x="640" y="300" font-family="Georgia, serif" font-style="italic" fill="#b8cde4" font-size="11">×29</text>
  </g>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">
    <text x="205" y="365" font-size="21" fill="#b8cde4">goodbye, mountain</text>
    <text x="905" y="410" font-size="21" fill="#f8faff">hello, floe</text>
  </g>
</svg>
