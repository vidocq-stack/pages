    .line { stroke: #4f8ff7; }
    .dot { fill: #4f8ff7; stroke: #111827; }
    .grid { stroke: #1f2937; }
    .axis { stroke: #4b5563; }
    .limit { stroke: #fbbf24; }
    .t1 { fill: #f3f4f6; }
