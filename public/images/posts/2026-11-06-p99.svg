  .grid { stroke: #e2e8f0; }
  .axis { stroke: #94a3b8; }
  .limit { stroke: #b45309; }
  .t1 { fill: #0f172a; }
  .t2 { fill: #475569; }
  .tl { fill: #b45309; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #111827; }
