<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="t d">
<title id="t">p99 latency of Vidocq against the request rate</title>
<desc id="d">5,000 req/s: p99 1.93 ms; 10,000 req/s: p99 1.91 ms; 20,000 req/s: p99 2.18 ms; 40,000 req/s: p99 2.08 ms; 60,000 req/s: p99 2.56 ms; 80,000 req/s: p99 8.81 ms</desc>

<style>
  .bg { fill: #f8faff; }
